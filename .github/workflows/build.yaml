name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  schedule:
    # Monthly automated release build on the 1st at 03:00 UTC
    - cron: '0 3 1 * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            garage_ssh_gate/src/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        working-directory: garage_ssh_gate/src
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: garage_ssh_gate/src
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: garage_ssh_gate/src
        run: cargo test

  prepare:
    name: Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' garage_ssh_gate/config.yaml | awk '{print $2}' | tr -d '"')

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            VERSION="${BASE_VERSION}-monthly.$(date -u +%Y%m)"
            IS_RELEASE="false"
          else
            VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
            IS_RELEASE="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

  integration:
    name: Integration E2E (SSH/TOFU/Webhook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssh-client curl

      - name: Build test image (amd64)
        run: |
          docker build \
            --file garage_ssh_gate/Dockerfile \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest \
            --build-arg VERSION=ci-test \
            --tag garage-ssh-gate:ci-test \
            garage_ssh_gate

      - name: Run end-to-end integration tests
        run: |
          bash tests/integration/e2e.sh --engine docker --image garage-ssh-gate:ci-test

  build:
    name: Build Docker Image
    needs: [lint, prepare, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Determine base image
        id: base
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              echo "platform=linux/amd64" >> $GITHUB_OUTPUT
              echo "base=ghcr.io/home-assistant/amd64-base:latest" >> $GITHUB_OUTPUT
              echo "builder=docker.io/rust:1.85-alpine" >> $GITHUB_OUTPUT
              ;;
            aarch64)
              echo "platform=linux/arm64" >> $GITHUB_OUTPUT
              echo "base=ghcr.io/home-assistant/aarch64-base:latest" >> $GITHUB_OUTPUT
              echo "builder=docker.io/rust:1.85-alpine" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: garage_ssh_gate
          file: garage_ssh_gate/Dockerfile
          platforms: ${{ steps.base.outputs.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.arch }}-garage-ssh-gate:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.arch }}-garage-ssh-gate:latest
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.base }}
            BUILDER_FROM=${{ steps.base.outputs.builder }}
            VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            io.hass.version=${{ needs.prepare.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish-manifest:
    name: Publish Multi-Arch Tags
    needs: [build, prepare]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch version tag
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/garage-ssh-gate:${{ needs.prepare.outputs.version }} \
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/amd64-garage-ssh-gate:${{ needs.prepare.outputs.version }} \
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/aarch64-garage-ssh-gate:${{ needs.prepare.outputs.version }}

      - name: Create multi-arch latest tag
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/garage-ssh-gate:latest \
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/amd64-garage-ssh-gate:latest \
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/aarch64-garage-ssh-gate:latest
