name: Nightly Dependency Update

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-deps:
    name: Update Dependencies & Rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo dependencies
        working-directory: garage_ssh_gate/src
        run: |
          cargo update
          cargo build --release 2>&1 | tail -20

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet garage_ssh_gate/src/Cargo.lock 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated lockfile
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garage_ssh_gate/src/Cargo.lock
          git commit -m "chore: nightly dependency update $(date +%Y-%m-%d)"
          git push

      - name: Trigger rebuild
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: nightly-rebuild
