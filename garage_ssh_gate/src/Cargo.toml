[package]
name = "garage-ssh-gate"
version = "1.0.0"
edition = "2024"
authors = ["Max-42"]
description = "SSH-based garage door opener for Home Assistant"
license = "MIT"
rust-version = "1.85"

[dependencies]
# SSH server
russh = "0.49"
russh-keys = "0.49"
async-trait = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web server (ingress UI)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (webhook)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "alloc"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

# HTML sanitization
ammonia = "4"

# UUID for key IDs
uuid = { version = "1", features = ["v4", "serde"] }

# File locking
fd-lock = "4"

# Error handling
anyhow = "1"

# Base64 encoding
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
