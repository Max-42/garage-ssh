name: "Garage SSH Gate"
description: >-
  SSH-based garage door opener for Home Assistant. Uses SSH public key
  authentication with Apple Shortcuts to securely open your garage door.
  Features TOFU key management, geofencing, and a web UI for key management.
version: "1.0.0"
slug: "garage_ssh_gate"
init: false
arch:
  - aarch64
  - amd64
url: "https://github.com/Max-42/garage-ssh"
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:garage-variant
panel_title: "Garage SSH"
panel_admin: true
apparmor: true
ports:
  "2242/tcp": 2242
ports_description:
  "2242/tcp": "SSH server for garage key authentication"
map:
  - type: data
    read_only: false
options:
  ssh_port: 2242
  webhook_url: ""
  home_latitude: 0.0
  home_longitude: 0.0
  geofence_radius_km: 15
  geofence_override_timeout_sec: 45
  tofu_timeout_sec: 45
  untrusted_key_retention_days: 21
  expected_json_version: "1.0.1"
  log_level: "info"
  host_key_pem: ""
schema:
  ssh_port: "port"
  webhook_url: "url?"
  home_latitude: "float(-90,90)"
  home_longitude: "float(-180,180)"
  geofence_radius_km: "float(0.1,)"
  geofence_override_timeout_sec: "int(10,300)"
  tofu_timeout_sec: "int(10,300)"
  untrusted_key_retention_days: "int(1,90)"
  expected_json_version: "str"
  log_level: "list(trace|debug|info|warn|error)"
  host_key_pem: "str?"
